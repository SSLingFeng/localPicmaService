server:
  # 服务端口号
  port: 8085
# LOGGING
logging:
  level:
    root: info
    com.example.localPicmaService.tool.SQLTool.SqlUtil: debug
spring:
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/database
    username:
    password:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 1800000
  data:
    redis:
      host: 192.168.31.6
      port: 6379
      password:

