<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出错了</title>
  <style>
    :root {
      --bg:      #090912;
      --surface: #111122;
      --card:    #171730;
      --accent:  #d4a853;
      --text:    #e8e4dc;
      --text2:   #6b6580;
      --border:  #252545;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background:
        radial-gradient(ellipse at 15% 50%, rgba(30,20,60,.35) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 15%, rgba(20,30,50,.25) 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .error-card {
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 48px 40px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 16px 48px rgba(0,0,0,.5);
    }
    .error-code {
      font-size: 72px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -.02em;
      line-height: 1;
      margin-bottom: 8px;
    }
    .error-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
    }
    .error-msg {
      font-size: 14px;
      color: var(--text2);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all .25s;
    }
    .btn-primary {
      background: var(--accent);
      color: #090912;
      border: none;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(212,168,83,.3);
    }
    .btn-ghost {
      background: transparent;
      color: var(--text2);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code" id="errCode">404</div>
    <div class="error-title" id="errTitle">页面不存在</div>
    <div class="error-msg" id="errMsg">你访问的页面不存在或已被移除。</div>
    <div class="error-actions">
      <a href="/login" class="btn btn-primary" id="errAction">去登录</a>
      <a href="/home" class="btn btn-ghost">返回首页</a>
    </div>
  </div>

  <script>
    (function () {
      var map = {
        '400': { title: '请求错误',     msg: '服务器无法理解你的请求，请检查输入后重试。',   action: null },
        '401': { title: '未登录',       msg: '请先登录后再访问此页面。',                     action: { text: '去登录', href: '/login' } },
        '403': { title: '未授权访问',   msg: '你没有权限访问此页面，请先登录或联系管理员。', action: { text: '去登录', href: '/login' } },
        '404': { title: '页面不存在',   msg: '你访问的页面不存在或已被移除。',               action: null },
        '405': { title: '请求方式错误', msg: '服务器不支持当前的请求方式。',                 action: null },
        '408': { title: '请求超时',     msg: '服务器等待请求超时，请稍后重试。',             action: { text: '刷新页面', href: 'javascript:location.reload()' } },
        '500': { title: '服务器错误',   msg: '服务器内部错误，请稍后重试或联系管理员。',     action: { text: '刷新页面', href: 'javascript:location.reload()' } },
        '502': { title: '网关错误',     msg: '服务器网关异常，请稍后重试。',                 action: { text: '刷新页面', href: 'javascript:location.reload()' } },
        '503': { title: '服务不可用',   msg: '服务器暂时不可用，请稍后重试。',               action: { text: '刷新页面', href: 'javascript:location.reload()' } }
      };

      // 从 URL 参数 ?code=xxx 或 ?status=xxx 读取错误码
      var params = new URLSearchParams(location.search);
      var code = params.get('code') || params.get('status') || '404';
      var info = map[code] || { title: '出错了 (' + code + ')', msg: '发生了未知错误，请稍后重试。', action: null };

      document.title = code + ' - ' + info.title;
      document.getElementById('errCode').textContent = code;
      document.getElementById('errTitle').textContent = info.title;
      document.getElementById('errMsg').textContent = info.msg;

      var actionBtn = document.getElementById('errAction');
      if (info.action) {
        actionBtn.textContent = info.action.text;
        actionBtn.href = info.action.href;
      } else {
        // 默认行为：未登录去登录页，已登录回首页
        var hasToken = localStorage.getItem('token');
        actionBtn.textContent = hasToken ? '返回首页' : '去登录';
        actionBtn.href = hasToken ? '/home' : '/login';
      }
    })();
  </script>
</body>
</html>
