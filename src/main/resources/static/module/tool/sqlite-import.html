<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQLite 导入工具</title>
  <link rel="stylesheet" href="/public/res/lib/element-plus@2.14.4_index.css">
  <style>
    body { background:#090912; color:#e8e4dc; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .wrap { max-width:860px; margin:40px auto; padding:0 20px; }
    .panel { background:#111122; border:1px solid #252545; border-radius:8px; padding:20px; margin-bottom:20px; }
    .panel h3 { color:#e8e4dc; margin-bottom:16px; font-size:16px; }
    .stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .stat-item { background:#171730; border:1px solid #252545; border-radius:6px; padding:12px; text-align:center; }
    .stat-val { font-size:22px; font-weight:700; color:#d4a853; }
    .stat-label { font-size:11px; color:#6b6580; margin-top:4px; }
    .log-box { max-height:400px; overflow-y:auto; font-family:monospace; font-size:12px; line-height:1.8; color:#6b6580; background:#090912; padding:12px; border-radius:4px; }
    .log-box div { white-space:pre-wrap; }
    .back-fab { position:fixed; bottom:24px; right:24px; display:flex; align-items:center; gap:6px; padding:10px 18px; background:#171730; border:1px solid #252545; border-radius:10px; color:#6b6580; text-decoration:none; font-size:13px; }
  </style>
</head>
<body>
<div id="app" v-cloak class="wrap">
  <h1 style="color:#d4a853;margin-bottom:24px">SQLite 导入工具</h1>

  <!-- 上传表单 -->
  <div class="panel">
    <h3>导入配置</h3>
    <el-form label-width="80px" size="small">
      <el-form-item label="SQLite 文件">
        <el-upload ref="fileUpload" action="" :auto-upload="false" :show-file-list="true"
                   :limit="1" accept=".db" :on-change="onFileChange" :on-exceed="onExceed">
          <el-button icon="el-icon-upload2">选择 .db 文件</el-button>
        </el-upload>
      </el-form-item>
      <el-form-item label="类型">
        <el-select v-model="form.type" placeholder="选择类型" style="width:200px">
          <el-option label="漫画" value="漫画" />
          <el-option label="Coser" value="coser" />
        </el-select>
      </el-form-item>
      <el-form-item label="路径">
        <el-input v-model="form.path" placeholder="如 20250610" style="width:200px" />
      </el-form-item>
      <el-form-item>
        <el-button type="primary" :disabled="status.running || !form.file" @click="startImport">
          开始导入
        </el-button>
        <el-button type="danger" :disabled="!status.running" @click="stopTask">
          停止
        </el-button>
      </el-form-item>
    </el-form>
    <div v-if="status.running" style="color:#d4a853;font-size:13px;margin-top:8px">
      {{ status.status }}
    </div>
  </div>

  <!-- 进度面板 -->
  <div class="panel">
    <h3>执行进度</h3>
    <div class="stat-grid">
      <div class="stat-item">
        <div class="stat-val">{{ status.totalItems || 0 }}</div>
        <div class="stat-label">总记录</div>
      </div>
      <div class="stat-item">
        <div class="stat-val">{{ status.processedItems || 0 }}</div>
        <div class="stat-label">已导入</div>
      </div>
      <div class="stat-item">
        <div class="stat-val">{{ status.zippedChapters || 0 }}</div>
        <div class="stat-label">已压缩章节</div>
      </div>
      <div class="stat-item">
        <div class="stat-val">{{ status.deletedFolders || 0 }}</div>
        <div class="stat-label">已删除文件夹</div>
      </div>
    </div>
  </div>

  <!-- 日志 -->
  <div class="panel">
    <h3>执行日志</h3>
    <div ref="logBox" class="log-box">
      <div v-for="(line, i) in status.logs" :key="i">{{ line }}</div>
      <div v-if="!status.logs || !status.logs.length" style="color:#3a3650">暂无日志</div>
    </div>
  </div>

  <a href="/home" class="back-fab">&larr; 首页</a>
</div>

<script src="/public/res/module/auth.js"></script>
<script src="/public/res/lib/vue.global.prod.js"></script>
<script src="/public/res/lib/element-plus@2.14.4_index.full.js"></script>
<script src="https://unpkg.com/axios@1.7.9/dist/axios.min.js"></script>
<script>
Vue.createApp({
  data: function () {
    return {
      form: { file: null, type: '漫画', path: '' },
      status: { running: false, status: '空闲', logs: [] },
      timer: null
    };
  },
  mounted: function () {
    this.fetchStatus();
    this.timer = setInterval(this.fetchStatus, 2000);
  },
  beforeUnmount: function () {
    if (this.timer) clearInterval(this.timer);
  },
  methods: {
    onFileChange: function (file) {
      this.form.file = file.raw;
    },
    onExceed: function () {
      ElementPlus.ElMessage.warning('只能上传一个文件');
    },
    fetchStatus: function () {
      var self = this;
      axios.get('/page/comic/import/api/status').then(function (res) {
        self.status = res.data;
        self.$nextTick(function () {
          var box = self.$refs.logBox;
          if (box) box.scrollTop = box.scrollHeight;
        });
      });
    },
    startImport: function () {
      var self = this;
      if (!self.form.file) { ElementPlus.ElMessage.error('请选择文件'); return; }
      if (!self.form.type) { ElementPlus.ElMessage.error('请选择类型'); return; }
      if (!self.form.path.trim()) { ElementPlus.ElMessage.error('请输入路径'); return; }

      ElementPlus.ElMessageBox.confirm(
        '确定要导入吗？将读取 SQLite 数据并写入 manga_source，随后自动压缩章节。',
        '确认导入', { type: 'warning' }
      ).then(function () {
        var fd = new FormData();
        fd.append('file', self.form.file);
        fd.append('type', self.form.type);
        fd.append('path', self.form.path.trim());
        axios.post('/page/comic/import/api/upload', fd, {
          headers: { 'Content-Type': 'multipart/form-data' }
        }).then(function (res) {
          if (res.data.success) {
            ElementPlus.ElMessage.success('任务已启动');
          } else {
            ElementPlus.ElMessage.error(res.data.error || '启动失败');
          }
        }).catch(function () {
          ElementPlus.ElMessage.error('请求失败');
        });
      }).catch(function () {});
    },
    stopTask: function () {
      axios.post('/page/comic/import/api/stop');
    }
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
